name: Keep scheduled workflows alive

# GitHub disables scheduled workflows of public repositories after 60 days without repository activity.
# Re-enabling the workflows through the API resets that timer, so the monthly builds and weekly tests keep running.

on:
  schedule:
    - cron: '0 6 1 * *' # At 06:00 on the 1st of each month
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in build.yml testsuite.yml installers.yml keepalive.yml; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${workflow}/enable"
            echo "Enabled ${workflow}"
          done
