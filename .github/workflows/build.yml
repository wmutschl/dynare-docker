name: Build Docker images

# Builds the dynare/dynare images listed in versions.json from docker/Dockerfile and pushes them to Docker Hub.
# - schedule:          rebuild all "monthly" entries on the 21st of each month (picks up base image updates)
# - workflow_dispatch: build a selection (monthly, all, latest, or e.g. "7.2,6.5", "6.1-R2023b" or "7.2-octave")
# - pull_request/push: build the latest entry without pushing, to validate changes to the Dockerfile

on:
  schedule:
    - cron: '0 0 21 * *'
  workflow_dispatch:
    inputs:
      dynare:
        description: 'Images to build: monthly, all, latest, or comma-separated Dynare versions, optionally with MATLAB release or -octave (e.g. 7.2, 6.1-R2023b, 7.2-octave)'
        required: true
        default: 'monthly'
        type: string
      push:
        description: 'Push the images to Docker Hub'
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - 'docker/**'
      - 'versions.json'
      - '.github/workflows/build.yml'
      - '.github/scripts/matrix.py'
  push:
    branches-ignore:
      - main
    paths:
      - 'docker/**'
      - 'versions.json'
      - '.github/workflows/build.yml'
      - '.github/scripts/matrix.py'

# Superseded validation builds of a branch/PR are cancelled; scheduled and dispatched builds always run
concurrency:
  group: build-${{ github.ref }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'validate' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      push: ${{ steps.matrix.outputs.push }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute build matrix
        id: matrix
        run: |
          case "${{ github.event_name }}" in
            schedule)          selection=monthly; push=true ;;
            workflow_dispatch) selection="${{ inputs.dynare }}"; push="${{ inputs.push }}" ;;
            *)                 selection=latest; push=false ;;
          esac
          # Only publish images built from the main branch
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then push=false; fi
          matrix=$(python3 .github/scripts/matrix.py build "${selection}")
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "push=${push}" >> "$GITHUB_OUTPUT"
          echo "Selection: ${selection}, push: ${push}"
          echo "${matrix}" | python3 -m json.tool

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      # The MATLAB-based images are large (MATLAB + toolboxes + TeX Live, ~20 GB unpacked), so free up space on the runner
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The docker driver stores the layers only once (in the Docker image store), which saves disk space
          driver: docker

      - name: Log in to Docker Hub
        if: needs.setup.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build${{ needs.setup.outputs.push == 'true' && ' and push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: ${{ matrix.file }}
          pull: true
          push: ${{ needs.setup.outputs.push == 'true' }}
          build-args: ${{ matrix.build_args }}
          tags: ${{ matrix.tags }}

      - name: Show image size
        if: always()
        run: |
          docker images --filter reference='dynare/dynare' || true
          df -h /
